<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pantalla del estudiante</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #screen-image {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    #screen-status {
      position: absolute;
      top: 12px;
      left: 12px;
      color: #e5e7eb;
      background: rgba(0, 0, 0, 0.6);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <img id="screen-image" alt="Pantalla del estudiante" />
  <p id="screen-status">Solicitando pantalla del estudiante…</p>
  <script src="screen.js"></script>
</body>
</html>
